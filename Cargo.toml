[package]
name = "bevy-spaghetti"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Gaussian-convolved segment splats for Bevy"

[features]
default = ["render"]
render = ["dep:bevy", "dep:radsort"]
convert = ["dep:clap", "dep:gltf", "dep:anyhow"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["std", "bevy_asset", "bevy_core_pipeline", "bevy_render", "bevy_log"], optional = true }
bevy_math = { version = "0.20.1", default-features = false, features = ["std"] }
bytemuck = { version = "1.24", features = ["derive"] }
thiserror = "2"
radsort = { version = "0.1.1", optional = true }
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
gltf = { version = "1.4.1", features = ["KHR_materials_unlit"], optional = true }

[dev-dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["bevy_winit", "bevy_input_focus", "bevy_pbr", "ui_bevy_render", "default_font", "multi_threaded", "png", "x11"] }

[[bin]]
name = "spaghetti-convert"
path = "src/bin/convert.rs"
required-features = ["convert"]

[[example]]
name = "viewer"
required-features = ["render"]

[profile.dev]
debug = 0

[profile.dev.package.bevy-spaghetti]
opt-level = 2
